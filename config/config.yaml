capi:
  version: 2.23.5
  instanceName: default
  strictToInstanceName: false
  publicEndpoint: http://localhost:8380/api/
  runningMode: full
  adminPort: 8381
  reverseProxyHost:
  observability:
    jvm:
      enabled: true
  admin:
    protected: true
    group: capi-admin
  # The open-api endpoint is owner-supplied and CAPI fetches it itself. Link-local (cloud metadata)
  # is always refused; loopback is refused unless opted in here. RFC1918 is allowed — specs live there.
  openApi:
    allowLocalSpecEndpoints: false

  matchOpenApiSpec:
    enabled: false
    exempt: []
    #  - legacy-service
  rest:
    enabled: true
    port: 8380
    listeningAddress: 0.0.0.0
    contextPath: /api
    # Refuse a path with a "." or ".." SEGMENT (400). Observes only while false — watch
    # capi_dot_segment_requests_total{action="observed"} first. /range/1..10 is unaffected.
    rejectDotSegments: false
    ioThreads: 4
    connectionRequestTimeout: 5000
    requestTimeout: 5000
    responseTimeout: 120000
    # Close a backend connection after this long unused. Keep it BELOW the shortest idle timeout
    # on the path to the backend (corporate proxy / firewall / NAT / LB): those drop idle flows
    # without FIN or RST, and a socket reused after such a drop stalls until responseTimeout (504).
    connectionIdleTimeout: 30000
    # Bytes; -1 = unlimited. Pinned because Undertow's own default became 2 MiB in 2.3.21, which
    # silently broke every upload over 2 MiB in 2.23. Raise responseTimeout to match if you cap it.
    maxRequestSize: -1
  websocket:
    # Refuse an upgrade from an unlisted Origin (cross-site hijacking). Observes only while false.
    # No Origin is always allowed — its absence means a non-browser client. Uses the CORS allowlist.
    enforceOriginCheck: false
    enabled: false
    port: 8382
    listeningAddress: 0.0.0.0
    contextPath: /capi/*
    ioThreads: 8
    responseTimeout: 180000
  grpc:
    enabled: false
    port: 8384
    # -1 = unlimited. Pinned because Undertow's own default became 2 MiB in 2.3.21.
    maxRequestSize: -1
  # WebDAV (RFC 4918). Own listener; nothing here affects the REST gateway.
  # Internal-network only by design — it is a write protocol. See WEBDAV-DESIGN.md.
  webdav:
    enabled: false
    port: 8385
    # host = resolve by the service's webdav-host metadata (no rewriting needed; root-context ignored)
    # path = resolve by /{service}/{group} (needs the backend to know its public base URI)
    # both = host first, then path
    routing: both
    # Depth: infinity is an amplification lever, but some sync clients use it legitimately, so this
    # ships observing only. Watch capi_webdav_depth_total{action="observed"} before enforcing.
    maxDepth: 1
    enforceMaxDepth: false
    # Far larger than the REST timeout: a large PUT is the normal case and 180s would kill an upload.
    maxRequestTime: 3600000
    # -1 = unlimited. A large PUT is the normal case for WebDAV.
    maxRequestSize: -1

    # --- authentication -------------------------------------------------------------------------
    # A session id carried in the URL PATH: /s/<id>/service/group/file.docx
    #
    # This is the only supported mechanism, and deliberately so. A document is opened by handing the
    # client a URL and nothing else, and a WebDAV client addresses a parent collection by truncating
    # the filename — discarding any query string with it. A path segment survives that. Cookies,
    # X-MS-CookieUri and bearer/forms challenges were all tried against a real Office client and none
    # of them worked. Blank disables it.
    sessionPathPrefix: /s/
    # Session lifetime in seconds. Keep it at or below the access token's own lifetime, or a request
    # an hour in resolves to an expired token and is refused for a reason nothing explains.
    sessionTtlSeconds: 3600
    maxSessions: 10000
    # Share tickets and sessions across the cluster via Hazelcast instead of holding them in this
    # process. REQUIRED with more than one CAPI behind a load balancer: a ticket is minted by the web
    # application and redeemed by the document client — two callers with no shared affinity — so with
    # a local store they land on different nodes and the ticket is unknown. Uses the Kubernetes
    # discovery settings from capi.throttle, as the MCP session store does.
    distributedSessions: false
    # Mints a session. POST only, authenticated with an ordinary bearer token which is validated
    # before anything is issued. Returns a single-use ticket and a reusable session + sessionPath.
    ticket:
      enabled: false
      ttlSeconds: 60
      maxOutstanding: 10000
      path: /.capi/ticket
  ssl:
    enabled: false
    keyStoreType: PKCS12
    path:
    password:
  trustStore:
    enabled: false
    path:
    encoded:
    password:
  consulCatalogDiscoverInterval: 60000
  consulHosts:
    - endpoint: http://localhost:8500
      token:
  consulStore:
    enabled: false
    endpoint: http://localhost:8500
    token:
  apiKeyStore:
    enabled: false
  oauth2:
    # Accept ?access_token=. On by default; the clients relying on it can only be found from traffic
    # (watch capi_query_token_requests_total). Stripped before forwarding either way.
    allowQueryParameterToken: true
    enabled: false
    cookieName:
    keys:
      - https://localhost:8080/keycloak/realms/capi/protocol/openid-connect/certs
  opa:
    enabled: false
    # One combined bundle (.tar.gz, multiple entrypoints), e.g.
    # http://opa-bundle-server:8080/bundles/bundle.tar.gz
    wasmBundleUrl:
    # Sent as Authorization: Bearer on every bundle fetch. Blank = unauthenticated bundle server.
    wasmBundleToken:
    wasmBundlePollIntervalSeconds: 60
    wasmPoolSize: 10
  traces:
    enabled: false
    serviceName: capi
    endpoint: http://localhost:4318
    extraMetadataPrefix:
    # Deployment environment (e.g. dev / acc / prod). Emitted as the "appEnvironment"
    # resource attribute on every span. Omitted from spans when left blank.
    appEnvironment:
  # MASTER SWITCH. false = CAPI sends no CORS header at all, and both allowedOrigins below and any
  # per-service `allowed-origins` metadata are ignored. Set true to activate them.
  corsEnabled: false
  # Gateway-wide FALLBACK, used only by services that declare no `allowed-origins` metadata of their
  # own (prefer that: it keeps one team's origin off another team's service). EMPTY DENIES EVERY
  # ORIGIN. Exact match on scheme+host+port; a single "*" sends the literal wildcard, never credentials.
  allowedOrigins: []
  #  - https://app.example.com
  allowedHeaders:
    - Origin
    - Accept
    - X-Requested-With
    - Content-Type
    - Access-Control-Request-Method
    - Authorization
  loggingTraces:
    enabled: false
    tenant: capi
    appName: capi
    appEnvironment: dev
    destination:
    filePath: /capi.logs
  accessLogs:
    enabled: false
    tenant: capi
    service: capi
    destination: localhost:5444
    filePath:
  throttle:
    enabled: false
    kubernetesNamespace:
    kubernetesServiceName:
  mcp:
    # The body is buffered whole BEFORE authentication, so it must be bounded.
    maxRequestSize: 1048576
    # Past the cap, initialize is refused rather than the process failing.
    maxSessions: 10000
    enabled: false
    port: 8383
    sessionTtl: 1800000
    toolCallTimeout: 30000
    circuitBreakerCooldownMs: 30000
    mcpServerDiscoveryTimeoutMs: 10000
    observability:
      genAi:
        enabled: false
    signing:
      # off | warn | enforce
      # Manifest signing requires consulStore.enabled=true; trust keys live under
      # the Consul KV prefix capi-mcp-trust-keys/<keyId>.
      mode: off