capi:
  version: 2.22
  instanceName: default
  strictToInstanceName: false
  publicEndpoint: http://localhost:8380/api/
  runningMode: full
  adminPort: 8381
  reverseProxyHost:
  observability:
    jvm:
      enabled: true
  rest:
    enabled: true
    port: 8380
    listeningAddress: 0.0.0.0
    contextPath: /api
    ioThreads: 4
    connectionRequestTimeout: 5000
    requestTimeout: 5000
    responseTimeout: 120000
    # Close a backend connection after this long unused. Keep it BELOW the shortest idle timeout
    # on the path to the backend (corporate proxy / firewall / NAT / LB): those drop idle flows
    # without FIN or RST, and a socket reused after such a drop stalls until responseTimeout (504).
    connectionIdleTimeout: 30000
  websocket:
    enabled: false
    port: 8382
    listeningAddress: 0.0.0.0
    contextPath: /capi/*
    ioThreads: 8
    responseTimeout: 180000
  grpc:
    enabled: false
    port: 8384
  ssl:
    enabled: false
    keyStoreType: PKCS12
    path:
    password:
  trustStore:
    enabled: false
    path:
    encoded:
    password:
  consulCatalogDiscoverInterval: 60000
  consulHosts:
    - endpoint: http://localhost:8500
      token:
  consulStore:
    enabled: false
    endpoint: http://localhost:8500
    token:
  apiKeyStore:
    enabled: false
  oauth2:
    enabled: false
    cookieName:
    keys:
      - https://localhost:8080/keycloak/realms/capi/protocol/openid-connect/certs
  opa:
    enabled: false
    # Full URL of the wasm bundle. CAPI now consumes a single combined bundle
    # (one .tar.gz with multiple entrypoints) — OPA's recommended layout per
    # https://www.openpolicyagent.org/docs/management-bundles
    # Example: http://opa-bundle-server:8080/bundles/bundle.tar.gz
    wasmBundleUrl:
    # Optional bearer token sent as Authorization: Bearer <token> on every
    # bundle fetch. Leave blank for an unauthenticated bundle server.
    wasmBundleToken:
    wasmBundlePollIntervalSeconds: 60
    wasmPoolSize: 10
  traces:
    enabled: false
    serviceName: capi
    endpoint: http://localhost:4318
    extraMetadataPrefix:
    # Deployment environment (e.g. dev / acc / prod). Emitted as the "appEnvironment"
    # resource attribute on every span. Omitted from spans when left blank.
    appEnvironment:
  corsEnabled: false
  allowedHeaders:
    - Origin
    - Accept
    - X-Requested-With
    - Content-Type
    - Access-Control-Request-Method
    - Authorization
  loggingTraces:
    enabled: false
    tenant: capi
    appName: capi
    appEnvironment: dev
    destination:
    filePath: /capi.logs
  accessLogs:
    enabled: false
    tenant: capi
    service: capi
    destination: localhost:5444
    filePath:
  throttle:
    enabled: false
    kubernetesNamespace:
    kubernetesServiceName:
  mcp:
    enabled: false
    port: 8383
    sessionTtl: 1800000
    toolCallTimeout: 30000
    circuitBreakerCooldownMs: 30000
    mcpServerDiscoveryTimeoutMs: 10000
    observability:
      genAi:
        enabled: false
    signing:
      # off | warn | enforce
      # Manifest signing requires consulStore.enabled=true; trust keys live under
      # the Consul KV prefix capi-mcp-trust-keys/<keyId>.
      mode: off