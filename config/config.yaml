capi:
  version: 2.10
  instanceName: default
  strictToInstanceName: false
  publicEndpoint: http://localhost:8380/api/
  runningMode: full
  adminPort: 8381
  reverseProxyHost:
  rest:
    enabled: false
    port: 8380
    listeningAddress: 0.0.0.0
    contextPath: /api
    ioThreads: 4
    connectionRequestTimeout: 5000
    requestTimeout: 5000
    responseTimeout: 120000
  websocket:
    enabled: false
    port: 8382
    listeningAddress: 0.0.0.0
    contextPath: /capi/*
    ioThreads: 8
    responseTimeout: 180000
  grpc:
    enabled: false
    port: 8384
  ssl:
    enabled: false
    keyStoreType: PKCS12
    path:
    password:
  trustStore:
    enabled: false
    path:
    encoded:
    password:
  consulCatalogDiscoverInterval: 10000
  consulHosts:
    - endpoint: https://localhost:8500
      token:
  consulStore:
    enabled: false
    endpoint: http://localhost:8500
    token:
  apiKeyStore:
    enabled: false
  oauth2:
    enabled: false
    cookieName:
    keys:
      - https://localhost:8080/keycloak/realms/capi/protocol/openid-connect/certs
  opa:
    enabled: false
    wasmBundleUrl:
    wasmBundlePollIntervalSeconds: 60
    wasmPoolSize: 10
  traces:
    enabled: false
    serviceName: capi
    endpoint: http://localhost:4318
    extraMetadataPrefix:
  corsEnabled: false
  allowedHeaders:
    - Origin
    - Accept
    - X-Requested-With
    - Content-Type
    - Access-Control-Request-Method
    - Authorization
  loggingTraces:
    enabled: false
    tenant: capi
    appName: capi
    appEnvironment: dev
    destination:
    filePath: /capi.logs
  accessLogs:
    enabled: false
    tenant: capi
    service: capi
    destination: localhost:5444
    filePath:
  throttle:
    enabled: false
    kubernetesNamespace:
    kubernetesServiceName:
  mcp:
    enabled: false
    port: 8383
    sessionTtl: 1800000
    toolCallTimeout: 30000
    circuitBreakerCooldownMs: 30000
    mcpServerDiscoveryTimeoutMs: 10000
    observability:
      genAi:
        enabled: false
    signing:
      # off | warn | enforce
      # Manifest signing requires consulStore.enabled=true; trust keys live under
      # the Consul KV prefix capi-mcp-trust-keys/<keyId>.
      mode: off