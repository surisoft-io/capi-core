capi:
  version: 2.22
  instanceName: default
  strictToInstanceName: false
  publicEndpoint: http://localhost:8380/api/
  runningMode: full
  adminPort: 8381
  reverseProxyHost:
  observability:
    jvm:
      enabled: true
  admin:
    protected: true
    group: capi-admin
  # Governance: a fetched OpenAPI spec must identify the service that declared it —
  # info.title == the Consul service name (exact), and info.version must be set.
  # OFF by default. The verdict is computed every cycle regardless and published at
  # /info/spec-compliance, so you can watch nonCompliant drain to zero (safeToEnable: true)
  # before turning this on. Nothing is logged while it is off.
  # `exempt` lists Consul service NAMES that keep routing even while enforcing — operator
  # config on purpose, so an owner cannot exempt themselves.
  # The `open-api` endpoint is owner-supplied and CAPI fetches it itself, with the Consul HTTP
  # client and its trust store. Endpoints resolving to link-local (cloud metadata) are always
  # refused; loopback (CAPI's own admin port, a co-located Consul agent) is refused unless you
  # opt in here. Private/RFC1918 addresses are allowed — that is where a spec normally lives.
  openApi:
    allowLocalSpecEndpoints: false

  matchOpenApiSpec:
    enabled: false
    exempt: []
    #  - legacy-service
  rest:
    enabled: true
    port: 8380
    listeningAddress: 0.0.0.0
    contextPath: /api
    # Refuse a path containing a `.` or `..` segment with 400. OFF by default: a request that this
    # build would refuse is one an existing deployment forwards today, so the guard first only
    # counts what it sees — watch capi_dot_segment_requests_total{action="observed"} stay at zero on
    # real traffic, then turn this on. Only a WHOLE segment equal to "." or ".." counts; ordinary
    # paths like /range/1..10 or /report..pdf are unaffected.
    rejectDotSegments: false
    ioThreads: 4
    connectionRequestTimeout: 5000
    requestTimeout: 5000
    responseTimeout: 120000
    # Close a backend connection after this long unused. Keep it BELOW the shortest idle timeout
    # on the path to the backend (corporate proxy / firewall / NAT / LB): those drop idle flows
    # without FIN or RST, and a socket reused after such a drop stalls until responseTimeout (504).
    connectionIdleTimeout: 30000
    # Largest request body, in bytes. -1 = unlimited (the pre-2.23 behaviour).
    # Pinned explicitly: Undertow changed its own default from unlimited to 2 MiB in 2.3.21, which
    # silently broke every upload over 2 MiB in 2.23.
    maxRequestSize: -1
  websocket:
    # Refuse a WebSocket upgrade whose Origin is not allowlisted (cross-site hijacking). OFF by
    # default: refusing an upgrade breaks a client outright, so watch
    # capi_websocket_origin_total{action="observed"} first. A request with NO Origin is always
    # allowed — browsers always send one, so its absence means a non-browser client. Uses the same
    # allowlist as CORS: allowedOrigins + the per-service allowed-origins metadata.
    enforceOriginCheck: false
    enabled: false
    port: 8382
    listeningAddress: 0.0.0.0
    contextPath: /capi/*
    ioThreads: 8
    responseTimeout: 180000
  grpc:
    enabled: false
    port: 8384
    # -1 = unlimited. Pinned because Undertow's own default became 2 MiB in 2.3.21.
    maxRequestSize: -1
  # WebDAV (RFC 4918). Own listener; nothing here affects the REST gateway.
  # Internal-network only by design — it is a write protocol. See WEBDAV-DESIGN.md.
  webdav:
    enabled: false
    port: 8385
    # host = resolve by the service's webdav-host metadata (no rewriting needed, the client's URL
    #        space is the backend's; recommended for Windows/Finder)
    # path = resolve by /{service}/{group} (needs the backend to know its public base URI)
    # both = host first, then path
    routing: both
    # Depth: infinity is an amplification lever, but some sync clients use it legitimately, so this
    # ships observing only. Watch capi_webdav_depth_total{action="observed"} before enforcing.
    maxDepth: 1
    enforceMaxDepth: false
    # Far larger than the REST timeout: a large PUT is the normal case and 180s would kill an upload.
    maxRequestTime: 3600000
    # -1 = unlimited. A large PUT is the normal case for WebDAV.
    maxRequestSize: -1
    basicAuth:
      # No GUI WebDAV client can send a bearer token, so the password field carries a raw JWT.
      # Requires TLS in front: Windows refuses Basic over plaintext by default (BasicAuthLevel).
      # NOTE: phase 2 — not yet implemented.
      enabled: false
      realm: CAPI WebDAV
  ssl:
    enabled: false
    keyStoreType: PKCS12
    path:
    password:
  trustStore:
    enabled: false
    path:
    encoded:
    password:
  consulCatalogDiscoverInterval: 60000
  consulHosts:
    - endpoint: http://localhost:8500
      token:
  consulStore:
    enabled: false
    endpoint: http://localhost:8500
    token:
  apiKeyStore:
    enabled: false
  oauth2:
    # Accept ?access_token= as a token source. On by default: unlike a config change, the clients
    # relying on it can only be found from traffic — watch capi_query_token_requests_total, then
    # switch it off. Either way the parameter is stripped before forwarding, so it never reaches a
    # backend's access log.
    allowQueryParameterToken: true
    enabled: false
    cookieName:
    keys:
      - https://localhost:8080/keycloak/realms/capi/protocol/openid-connect/certs
  opa:
    enabled: false
    # Full URL of the wasm bundle. CAPI now consumes a single combined bundle
    # (one .tar.gz with multiple entrypoints) — OPA's recommended layout per
    # https://www.openpolicyagent.org/docs/management-bundles
    # Example: http://opa-bundle-server:8080/bundles/bundle.tar.gz
    wasmBundleUrl:
    # Optional bearer token sent as Authorization: Bearer <token> on every
    # bundle fetch. Leave blank for an unauthenticated bundle server.
    wasmBundleToken:
    wasmBundlePollIntervalSeconds: 60
    wasmPoolSize: 10
  traces:
    enabled: false
    serviceName: capi
    endpoint: http://localhost:4318
    extraMetadataPrefix:
    # Deployment environment (e.g. dev / acc / prod). Emitted as the "appEnvironment"
    # resource attribute on every span. Omitted from spans when left blank.
    appEnvironment:
  # MASTER SWITCH. false = CAPI sends no CORS header at all, and both allowedOrigins below and any
  # per-service `allowed-origins` metadata are ignored. Set true to activate them.
  corsEnabled: false
  # Gateway-wide FALLBACK for browser origins (requires corsEnabled: true). Prefer the per-service `allowed-origins` key in
  # Consul ServiceMeta, which lets each service owner set their own and keeps one team's origin
  # from being trusted on another team's service. This list applies only to services that declare
  # none. EMPTY OR ABSENT DENIES EVERY ORIGIN.
  # An origin must match exactly (scheme + host + port) to be echoed back, and only an exact
  # match is offered Access-Control-Allow-Credentials. A single "*" entry sends the literal
  # wildcard and never credentials, which is the only spec-valid way to open this up.
  # CAPI used to reflect whatever Origin the caller sent, together with credentials, which let
  # any website read authenticated responses.
  allowedOrigins: []
  #  - https://app.example.com
  allowedHeaders:
    - Origin
    - Accept
    - X-Requested-With
    - Content-Type
    - Access-Control-Request-Method
    - Authorization
  loggingTraces:
    enabled: false
    tenant: capi
    appName: capi
    appEnvironment: dev
    destination:
    filePath: /capi.logs
  accessLogs:
    enabled: false
    tenant: capi
    service: capi
    destination: localhost:5444
    filePath:
  throttle:
    enabled: false
    kubernetesNamespace:
    kubernetesServiceName:
  mcp:
    # The JSON-RPC body is buffered whole before the request is authenticated, so it is bounded:
    # without this one unauthenticated POST can exhaust the heap. 1 MiB is far above a real call.
    maxRequestSize: 1048576
    # Sessions live for sessionTtl, so cap how many can exist at once; past it, initialize is
    # refused rather than the process failing.
    maxSessions: 10000
    enabled: false
    port: 8383
    sessionTtl: 1800000
    toolCallTimeout: 30000
    circuitBreakerCooldownMs: 30000
    mcpServerDiscoveryTimeoutMs: 10000
    observability:
      genAi:
        enabled: false
    signing:
      # off | warn | enforce
      # Manifest signing requires consulStore.enabled=true; trust keys live under
      # the Consul KV prefix capi-mcp-trust-keys/<keyId>.
      mode: off