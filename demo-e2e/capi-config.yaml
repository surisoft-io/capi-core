capi:
  version: 1.0.0
  instanceName: default
  strictToInstanceName: false
  publicEndpoint: http://localhost:8380/api/
  runningMode: full
  adminPort: 8381
  reverseProxyHost:
  rest:
    enabled: true
    port: 8380
    listeningAddress: 0.0.0.0
    contextPath: /api
    connectionRequestTimeout: 5000
    requestTimeout: 5000
    responseTimeout: 120000
    maxTotalConnections: 500
    maxConnectionsPerRoute: 50
    undertowWorkerThreads: 500
    undertowIoThreads: 0
  websocket:
    enabled: true
    port: 8382
    listeningAddress: 0.0.0.0
    contextPath: /capi/*
  grpc:
    enabled: true
    port: 8384
  ssl:
    enabled: false
    keyStoreType: PKCS12
    path:
    password:
  trustStore:
    enabled: false
    path:
    encoded:
    password:
  consulCatalogDiscoverInterval: 10000
  consulHosts:
    - endpoint: http://consul:8500
      token:
  consulStore:
    enabled: true
    endpoint: http://consul:8500
    token:
  apiKeyStore:
    enabled: true
  oauth2:
    enabled: true
    cookieName:
    keys:
      - http://keycloak:8080/keycloak/realms/e2e-demo/protocol/openid-connect/certs
  opa:
    enabled: true
    endpoint: http://opa:8181
  traces:
    enabled: true
    serviceName: capi
    endpoint: http://otel-collector:4318
    extraMetadataPrefix:
  corsEnabled: false
  allowedHeaders:
    - Origin
    - Accept
    - X-Requested-With
    - Content-Type
    - Access-Control-Request-Method
    - Authorization
  loggingTraces:
    enabled: false
    tenant: capi
    appName: capi
    appEnvironment: dev
    destination: localhost:5444
    filePath:
  accessLogs:
    enabled: false
    tenant: capi
    service: capi
    destination: localhost:5444
    filePath:
  throttle:
    enabled: true
    kubernetesNamespace:
    kubernetesServiceName:
  mcp:
    enabled: true
    port: 8383
    sessionTtl: 1800000
    toolCallTimeout: 30000
    circuitBreakerCooldownMs: 30000
    mcpServerDiscoveryTimeoutMs: 10000
