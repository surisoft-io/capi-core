capi:
  version: 1.0.0
  instanceName: default
  strictToInstanceName: false
  publicEndpoint: http://localhost:8380/api/
  runningMode: full
  adminPort: 8381
  reverseProxyHost:
  # scenarios.sh drives the admin endpoints without a token, so this stack opts out explicitly.
  # Trust-store writes are still refused on an unprotected listener (verified by the e2e below).
  admin:
    protected: false
  matchOpenApiSpec:
    enabled: false
    exempt: []
  rest:
    enabled: true
    port: 8380
    listeningAddress: 0.0.0.0
    contextPath: /api
    rejectDotSegments: false
    connectionRequestTimeout: 5000
    requestTimeout: 5000
    responseTimeout: 120000
  websocket:
    enforceOriginCheck: false
    enabled: true
    port: 8382
    listeningAddress: 0.0.0.0
    contextPath: /capi/*
  grpc:
    enabled: true
    port: 8384
  ssl:
    enabled: false
    keyStoreType: PKCS12
    path:
    password:
  trustStore:
    enabled: false
    path:
    encoded:
    password:
  consulCatalogDiscoverInterval: 10000
  consulHosts:
    - endpoint: http://consul:8500
      token:
  consulStore:
    enabled: true
    endpoint: http://consul:8500
    token:
  apiKeyStore:
    enabled: true
  oauth2:
    enabled: true
    cookieName:
    keys:
      - http://keycloak:8080/keycloak/realms/e2e-demo/protocol/openid-connect/certs
  opa:
    enabled: true
    wasmBundleUrl: http://opa-bundle-server:8080/bundles/bundle.tar.gz
    wasmBundlePollIntervalSeconds: 30
    wasmPoolSize: 10
  traces:
    enabled: true
    serviceName: capi
    endpoint: http://otel-collector:4318
    extraMetadataPrefix:
    appEnvironment: demo-e2e
  corsEnabled: true
  # Gateway-wide fallback. `generic-service` overrides it with its own allowed-origins meta.
  allowedOrigins:
    - http://gateway-default.example
  allowedHeaders:
    - Origin
    - Accept
    - X-Requested-With
    - Content-Type
    - Access-Control-Request-Method
    - Authorization
  loggingTraces:
    enabled: false
    tenant: capi
    appName: capi
    appEnvironment: dev
    destination: localhost:5444
    filePath:
  accessLogs:
    enabled: false
    tenant: capi
    service: capi
    destination: localhost:5444
    filePath:
  throttle:
    enabled: true
    kubernetesNamespace:
    kubernetesServiceName:
  mcp:
    enabled: true
    port: 8383
    sessionTtl: 1800000
    toolCallTimeout: 30000
    circuitBreakerCooldownMs: 30000
    mcpServerDiscoveryTimeoutMs: 10000
    observability:
      genAi:
        enabled: true
