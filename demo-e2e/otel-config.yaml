receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic

  opensearch/traces:
    http:
      endpoint: https://opensearch:9200
      auth:
        authenticator: basicauth
      tls:
        insecure_skip_verify: true
    dataset: traces

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth:
    client_auth:
      username: admin
      password: "${env:OPENSEARCH_PASSWORD}"

service:
  extensions: [health_check, basicauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, opensearch/traces]
