{{- if and .Values.mcpIngress.enabled .Values.capi.mcp.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "capi-core.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capi-core.labels" . | nindent 4 }}
  {{- with .Values.mcpIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.mcpIngress.className }}
  ingressClassName: {{ .Values.mcpIngress.className }}
  {{- end }}
  {{- if .Values.mcpIngress.tls }}
  tls:
    {{- range .Values.mcpIngress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.mcpIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "capi-core.fullname" $ }}
                port:
                  name: mcp
          {{- end }}
    {{- end }}
{{- end }}