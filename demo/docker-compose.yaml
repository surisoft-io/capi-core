services:

  # --- Infrastructure ---

  consul:
    image: hashicorp/consul:1.22
    container_name: demo-consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- CAPI Gateway ---

  capi:
    build:
      context: ..
      dockerfile: Dockerfile
    # Or use a published image (once MCP is released):
    #image: surisoft/capi-core:latest
    container_name: demo-capi
    ports:
      - "8380:8380"   # REST gateway
      - "8381:8381"   # Admin API
      - "8383:8383"   # MCP gateway
      - "8384:8384"   # gRPC gateway
    volumes:
      - ./capi-config.yaml:/capi/config/config.yaml
    environment:
      CAPI_CONFIG_FILE: /capi/config/config.yaml
    depends_on:
      consul:
        condition: service_healthy

  # --- Dummy Backend Services ---
  # These are plain REST APIs. They know nothing about MCP.
  # CAPI discovers them via Consul and exposes them as MCP tools.

  weather-service:
    image: python:3-alpine
    container_name: demo-weather
    working_dir: /app
    volumes:
      - ./services:/app:ro
    command: python weather.py

  inventory-service:
    image: python:3-alpine
    container_name: demo-inventory
    working_dir: /app
    volumes:
      - ./services:/app:ro
    command: python inventory.py

  translate-service:
    image: python:3-alpine
    container_name: demo-translate
    working_dir: /app
    volumes:
      - ./services:/app:ro
    command: python translate.py

  # --- MCP Server Backend ---
  # Unlike the REST services above, this is a real MCP Server.
  # It speaks JSON-RPC 2.0 and implements initialize, tools/list, tools/call.
  # CAPI discovers its tools automatically — no mcp-tools metadata needed.

  math-mcp-server:
    image: python:3-alpine
    container_name: demo-math-mcp
    working_dir: /app
    volumes:
      - ./services:/app:ro
    command: python math_mcp_server.py

  # --- Dummy gRPC Backend ---
  # A simple gRPC Greeter service. CAPI proxies it transparently via HTTP/2.

  greeter-grpc:
    image: python:3-alpine
    container_name: demo-greeter-grpc
    working_dir: /work
    volumes:
      - ./services:/src:ro
    command: >
      sh -c "cp /src/greeter.proto /src/greeter_grpc.py . &&
             pip install --quiet grpcio grpcio-tools grpcio-reflection protobuf &&
             python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. greeter.proto &&
             python greeter_grpc.py"

  # --- Service Registration ---
  # Registers the dummy services in Consul with MCP metadata.
  # Runs once and exits.

  registrar:
    image: alpine/curl:latest
    container_name: demo-registrar
    volumes:
      - ./register-services.sh:/register.sh:ro
    entrypoint: ["sh", "/register.sh"]
    restart: "no"
    depends_on:
      consul:
        condition: service_healthy
      weather-service:
        condition: service_started
      inventory-service:
        condition: service_started
      translate-service:
        condition: service_started
      math-mcp-server:
        condition: service_started
      greeter-grpc:
        condition: service_started
