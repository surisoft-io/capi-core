capi:
  version: 1.0.0
  instanceName: default
  strictToInstanceName: false
  publicEndpoint: http://localhost:8380/api/
  runningMode: full
  adminPort: 8381
  reverseProxyHost:
  rest:
    enabled: true
    port: 8380
    listeningAddress: 0.0.0.0
    contextPath: /api
    connectionRequestTimeout: 5000
    requestTimeout: 5000
    responseTimeout: 120000
  websocket:
    enabled: false
    port: 8382
    listeningAddress: 0.0.0.0
    contextPath: /capi/*
  grpc:
    enabled: true
    port: 8384
  ssl:
    enabled: false
    keyStoreType: PKCS12
    path:
    password:
  trustStore:
    enabled: false
    path:
    encoded:
    password:
  consulCatalogDiscoverInterval: 60000
  consulHosts:
    - endpoint: http://consul:8500
      token:
  consulStore:
    enabled: false
    endpoint: http://localhost:8500
    token:
  oauth2:
    enabled: false
    cookieName:
    keys:
      - http://localhost:8080/keycloak/realms/capi/protocol/openid-connect/certs
  opa:
    enabled: false
    endpoint: http://localhost:8181
  traces:
    enabled: false
    serviceName: capi
    endpoint: http://localhost:4318
    extraMetadataPrefix:
  corsEnabled: false
  allowedHeaders:
    - Origin
    - Accept
    - X-Requested-With
    - Content-Type
    - Access-Control-Request-Method
    - Authorization
  loggingTraces:
    enabled: false
    tenant: capi
    appName: capi
    appEnvironment: dev
    destination: localhost:5444
    filePath:
  accessLogs:
    enabled: false
    tenant: capi
    service: capi
    destination: localhost:5444
    filePath:
  throttle:
    enabled: false
    kubernetesNamespace:
    kubernetesServiceName:
  mcp:
    enabled: true
    port: 8383
    sessionTtl: 1800000
    toolCallTimeout: 30000
    circuitBreakerCooldownMs: 30000
    mcpServerDiscoveryTimeoutMs: 10000